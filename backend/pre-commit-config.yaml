default_install_hook_types:
  - pre-commit
  - pre-push

fail_fast: false

repos:
  # ---------------------------------------------------------
  # Comprobaciones generales
  # ---------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]

      - id: check-toml
        stages: [pre-commit]

      - id: check-json
        stages: [pre-commit]

      - id: end-of-file-fixer
        stages: [pre-commit]

      - id: trailing-whitespace
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]

      - id: check-added-large-files
        stages: [pre-commit]

  # ---------------------------------------------------------
  # LINT + FORMAT
  # ---------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        name: Ruff lint
        args:
          - --fix
          - --exit-non-zero-on-fix
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        stages: [pre-commit]

  # ---------------------------------------------------------
  # TESTS
  # ---------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]